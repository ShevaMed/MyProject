name: CI Pipeline

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, reopened, synchronize, review_requested, submitted]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest --junitxml=report.xml

  analysis:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      # 1) Перевірка код-рев’ю
      - name: Code Review Check
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const { data: reviews } = await github.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr
            });
            if (!reviews.some(r => r.state === 'APPROVED')) {
              core.setFailed('Код-рев’ю не схвалено');
            }

      # 2) Count LOC
      - name: Count LOC with cloc
        run: |
          choco install cloc -y
          cloc src\ > cloc-report.txt
          type cloc-report.txt

      # 3) SonarQube аналіз
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          wget -qO sonar.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-windows.zip
          tar -xf sonar.zip
          .\sonar-scanner-4.8.0.2856-windows\bin\sonar-scanner.bat

      # 4) Lint & format
      - name: flake8 via Reviewdog
        uses: reviewdog/action-flake8@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: error

      - name: Black via Reviewdog
        uses: reviewdog/action-black@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: info
